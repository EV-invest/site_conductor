# Hand-written (not generated by the v_flakes `github` module): the Playwright
# visual suite only runs on Linux (the flake pins nixpkgs' browsers; macOS has
# none), so this is the one place the baselines in
# `frontend/tests/__screenshots__/` are checked and rendered. Two halves:
#
#   gate    `nix run .#test` — tsc, i18n and css checks, then the suite against
#           the committed baselines. Red = a section drifted (or a baseline is
#           missing, e.g. a new project's first run). Its actual/diff images are
#           kept as the `visual-diffs` artifact.
#   render  `nix run .#accept-test` — re-captures every baseline on this image
#           and publishes them as `visual-snapshots`, so a dev without a Linux
#           builder can refresh honestly:
#
#             gh run download <run-id> -n visual-snapshots -D frontend/tests/__screenshots__
#             git add frontend/tests/__screenshots__
#             git commit -m 'test(visual): refresh baselines (run <run-id>)'
#
#           Look at the diffs before committing — the artifact is what the branch
#           renders, not proof that the render is right.
#
# The home page cannot render without REA's per-locale portfolio snapshots
# (`public/mfe/portfolio.<locale>.html`, asserted at render by
# views/home/ui/portfolio); locally `populate-docs` builds them from a sibling
# clone, which the runner has not got, so the job builds the same `embeds`
# package straight from the private flake ref that flake.nix bakes into the
# image — hence the deploy key, as in release-container.yml.
name: Visual baselines
'on':
  pull_request:
    paths:
      - frontend/**
      - flake.nix
      - flake.lock
      - .github/workflows/visual-baselines.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  render:
    name: gate + render baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: ev-invest
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: SSH auth for the REA flake
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_REAL_ESTATE_ALLOCATION }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_KEY_REAL_ESTATE_ALLOCATION unset — the home page needs REA's portfolio snapshots. Provision: git_ops init-deploy-key ev-invest/real_estate_allocation" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/real_estate_allocation
          chmod 600 ~/.ssh/real_estate_allocation
          printf 'Host github.com\n  User git\n  IdentityFile ~/.ssh/real_estate_allocation\n  IdentitiesOnly yes\n' >> ~/.ssh/config
      - name: Stage REA portfolio snapshots + bundle
        shell: bash
        run: |
          set -euo pipefail
          # Same ref flake.nix bakes into the image (`real_estate_allocation`).
          out="$(nix build --no-link --print-out-paths -L 'git+ssh://git@github.com/ev-invest/real_estate_allocation?ref=refs/heads/main#embeds')"
          mkdir -p frontend/public/mfe
          cp -rL --no-preserve=mode "$out"/. frontend/public/mfe/
          for locale in en ru vi fr de; do test -f "frontend/public/mfe/portfolio.$locale.html"; done
      - name: Gate (typecheck, i18n, css, visual regression)
        # `run-test` also populates public/ and builds the zone shell manifest,
        # which the render step below relies on — keep this first.
        run: nix run .#test
      - name: Keep the gate's diffs
        if: always()
        shell: bash
        # Playwright empties test-results/ at the start of every run, so the
        # render step would wipe the gate's expected/actual/diff triples.
        run: |
          if [ -d frontend/test-results ]; then
            mv frontend/test-results "$RUNNER_TEMP/visual-diffs"
          fi
      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: ${{ runner.temp }}/visual-diffs/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Render baselines
        if: always()
        run: nix run .#accept-test
      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: frontend/tests/__screenshots__/**/*.png
          if-no-files-found: error
          retention-days: 14
